services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tinycrm
      POSTGRES_PASSWORD: tinycrm
      POSTGRES_DB: tinycrm_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tinycrm']
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '6379:6379'

volumes:
  pgdata:
